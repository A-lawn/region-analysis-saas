name: CI

on:
  push:
    branches: [main, 'codex/**', 'v3.*']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: region_analysis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Run tests
        working-directory: backend
        run: npx jest --forceExit --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: region_analysis
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-ci
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Type check
        working-directory: frontend-vue
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: frontend-vue
        run: npm run build
