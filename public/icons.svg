<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Chart / Dashboard -->
  <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="12" width="4" height="9" rx="0.5"/>
    <rect x="10" y="7" width="4" height="14" rx="0.5"/>
    <rect x="17" y="3" width="4" height="18" rx="0.5"/>
  </symbol>
  <!-- Upload / Document -->
  <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H7a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="13" x2="12" y2="18"/>
    <polyline points="9 16 12 13 15 16"/>
  </symbol>
  <!-- Map / Location -->
  <symbol id="icon-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
