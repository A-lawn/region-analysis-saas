name: region-analysis
services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: region-analysis-db
    environment:
      POSTGRES_DB: region_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/init_v2.sql:/docker-entrypoint-initdb.d/02_init_v2.sql
      - ./database/migrations/009_poi_cities.sql:/docker-entrypoint-initdb.d/03_poi_cities.sql
      - ./database/migrations/010_unify_kpi_weights.sql:/docker-entrypoint-initdb.d/04_kpi_weights.sql
      - ./database/migrations/011_backfill_decision_thresholds.sql:/docker-entrypoint-initdb.d/05_decision_thresholds.sql
      - ./database/migrations/012_huff_params_cache.sql:/docker-entrypoint-initdb.d/06_huff_params.sql
      - ./database/migrations/013_seed_huff_benchmarks.sql:/docker-entrypoint-initdb.d/07_huff_benchmarks.sql
      - ./database/migrations/014_jwt_signing_keys.sql:/docker-entrypoint-initdb.d/08_jwt_keys.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d region_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    container_name: region-analysis-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: region-analysis-api
    environment:
      PORT: "3000"
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_NAME: region_analysis
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENC_KEY: "${ENC_KEY:-}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-180}"
      AMAP_WEB_KEY: "${AMAP_WEB_KEY:-}"
      AMAP_SERVER_KEY: "${AMAP_SERVER_KEY:-}"
      PYTHON_COMPUTE_URL: "http://python-compute:8000"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  python-compute:
    build:
      context: ./compute-engine
      dockerfile: Dockerfile
    container_name: region-analysis-compute
    environment:
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_NAME: region_analysis
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENC_KEY: "${ENC_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_DIR: /app/logs
      LOG_TO_DB: "true"
      LOG_TO_FILE: "true"
    ports:
      - "8000:8000"
    volumes:
      - compute-logs:/app/logs
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: region-analysis-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/china-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/116.38,39.90;116.40,39.91"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-osrm

  frontend:
    image: nginx:alpine
    container_name: region-analysis-web
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  compute-logs:
