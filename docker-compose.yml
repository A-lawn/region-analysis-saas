name: region-analysis
services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: region-analysis-db
    environment:
      POSTGRES_DB: region_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d region_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    container_name: region-analysis-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: region-analysis-api
    environment:
      PORT: "3000"
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_NAME: region_analysis
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-180}"
      AMAP_WEB_KEY: "${AMAP_WEB_KEY:-}"
      AMAP_SERVER_KEY: "${AMAP_SERVER_KEY:-}"
    ports:
      - "3000:3000"
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


  # OSRM 路网路由引擎 — 等时圈 + 路网距离矩阵
  # 数据准备（首次运行前执行一次）：
  #   1. 下载中国路网: wget https://download.geofabrik.de/asia/china-latest.osm.pbf -P ./osrm-data/
  #   2. 预处理: docker run --rm -v ./osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-extract -p /opt/car.lua /data/china-latest.osm.pbf
  #              docker run --rm -v ./osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-partition /data/china-latest.osrm
  #              docker run --rm -v ./osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-customize /data/china-latest.osrm
  #   3. 启动: docker compose up -d osrm
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: region-analysis-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/china-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/116.38,39.90;116.40,39.91"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-osrm
  frontend:
    image: nginx:alpine
    container_name: region-analysis-web
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
